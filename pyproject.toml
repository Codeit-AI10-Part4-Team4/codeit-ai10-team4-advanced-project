# pyproject.toml
# ⚠️ 템플릿 초기화: `python scripts/init_template.py` 가 name/패키지명을 일괄 치환합니다.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeit-ai10-team4-advanced-project"
version = "0.1.0"
description = "동네 매장 소상공인을 위한 광고 문구·이미지 생성 서비스"
requires-python = ">=3.12"

# 런타임 의존성 — "어디서나 필요한 최소 집합"만 유지할 것.
# ⚠️ torch·diffusers 같은 무거운 것을 여기 넣지 말 것. CI 가 느려지고
#    GPU 없는 팀원까지 2GB 넘는 휠을 받게 된다. → 아래 ml extra 로.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",         # 레이아웃 합성 — 한글을 이미지에 얹는다
    "pyyaml>=6.0",            # 업종 레지스트리
    "sqlalchemy>=2.0.0",      # DB. 테스트는 SQLite, 운영은 PostgreSQL
]

# ── 설치 방법 ────────────────────────────────────────────────
#   전원 공통          pip install -e ".[dev,ui]"
#   NLU·문구 담당      pip install -e ".[dev,ui,llm,db]"
#   이미지 생성 담당    pip install -e ".[dev,ui,ml]"      ← GPU 필요
#
#   담당에 따라 다른 것만 깔면 된다. GPU 가 없는 사람은 ml 을 빼면
#   torch 를 받지 않는다.
# ─────────────────────────────────────────────────────────────
[project.optional-dependencies]

# 전원 — 개발·테스트 (CI 가 설치하는 것)
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",          # FastAPI TestClient 백엔드
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",    # PyYAML 은 인라인 타입이 없어 스텁 필요
    "nbconvert>=7.0.0",       # 노트북 → 스크립트 변환
    "ipykernel>=6.0.0",       # venv를 노트북 커널로 등록
]

# 전원 — 챗봇 화면
ui = [
    "streamlit>=1.49.0",      # width="stretch" API 사용
    "pandas>=2.0.0",          # st.data_editor
]

# NLU·문구 생성 담당 — 가볍다. GPU 불필요
llm = [
    "openai>=1.40.0",
]

# PostgreSQL 드라이버. 테스트는 SQLite 로 돌아서 CI 엔 필요 없다.
db = [
    "psycopg[binary]>=3.2.0",
]

# 이미지 생성 담당 — 무겁다(수 GB). GPU 필요
# ⚠️ torch 는 CUDA 버전에 맞는 휠을 먼저 설치할 것:
#      pip install torch --index-url https://download.pytorch.org/whl/cu124
#    그 뒤에 pip install -e ".[ml]" 하면 이미 설치된 torch 를 재사용한다.
ml = [
    "torch>=2.3.0",
    "diffusers>=0.30.0",
    "transformers>=4.43.0",
    "accelerate>=0.33.0",     # GPU 배치·오프로딩 (8GB 대응)
    # 누끼 — 제품 분리. onnxruntime 백엔드를 extra 로 명시해야 동작한다.
    # cpu 를 쓰는 이유: 8GB VRAM 을 SDXL 에 몰아주기 위해서다.
    # 누끼는 한 번만 돌고 빠르므로 CPU 로도 충분하다.
    "rembg[cpu]>=2.0.0",
    "safetensors>=0.4.0",
]

# 광고 규제 RAG — 코퍼스 구축 후 활성화
# rag = [
#     "chromadb>=0.5.0",
#     "rank-bm25>=0.2.2",
#     "sentence-transformers>=3.0.0",   # bge-m3
# ]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# EXE002: "실행 권한인데 shebang 이 없다"
# Windows 에서 Docker 로 코드를 바인드 마운트하면 모든 파일이 -rwxrwxrwx 로 보여
# 전 파일이 걸린다. 리눅스 체크아웃(CI)에서는 발생하지 않는 환경 아티팩트다.
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# tests/ 가 src/ 를 미러링하므로 tests/api/test_store.py 와 tests/app_core/test_store.py
# 처럼 파일명이 겹친다. 기본 import 방식은 이걸 같은 모듈로 보고 충돌을 낸다.
addopts = "--import-mode=importlib"

# eval/ 은 평가 자산이라 src/ 밖에 있고 설치 대상도 아니다(AGENTS.md).
# 그래서 저장소 루트를 경로에 넣어야 `from eval.metrics import ...` 가 된다.
# ⚠️ `python -m pytest` 로 돌리면 현재 폴더가 자동으로 경로에 들어가서 로컬에선
#    통과하지만, CI 는 `pytest` 로 돌려서 안 들어간다. 이 줄이 그 차이를 없앤다.
pythonpath = ["."]

# src 레이아웃: src/ 하위의 패키지(api, app_core)를 최상위 import 이름으로 노출.
# 따라서 코드는 `import app_core` / `from api import ...` 형태로 사용한다 (src. 접두어 없음).
[tool.setuptools.packages.find]
where = ["src"]

# Pylance/pyright(IDE 정적 분석) 경로 설정 — 없으면 IDE에서 내부 import가 unresolved로 표시됨.
[tool.pyright]
extraPaths = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = ["src"]
ignore_missing_imports = false   # 내부 코드엔 엄격하게
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# 점진 도입: 처음엔 아래 두 줄을 끄고 시작했다가 단계적으로 적용
# disallow_untyped_defs = true
# disallow_incomplete_defs = true

# 타입 스텁이 없는 무거운 extra 의존성은 overrides 로 예외 처리한다.
# ⚠️ CI 는 `.[dev]` 만 설치하므로 ml·llm extra 는 아예 없는 상태다.
#    이 예외가 없으면 src/ 에서 import 하는 순간 mypy 가 실패한다.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "diffusers.*",
    "transformers.*",
    "accelerate.*",
    "rembg.*",
    "streamlit.*",
    "pandas.*",
    "openai.*",
]
ignore_missing_imports = true
