# 업종 레지스트리
# 담당: 프롬프트 주제·VLM 힌트·문구 페르소나·적용 법령 태그
# 담당하지 않음: 색감(styles.yaml), 치수(formats.yaml)
#
# status: verified = 결과 품질을 실제로 검증하고 프롬프트를 튜닝한 업종
#         beta     = 정의만 해둔 업종. UI에 '베타' 뱃지 표시
# needs_photo: false = 사진 소재가 없는 것이 정상인 업종 (배경만 생성 모드)

- id: cafe
  label: 카페·디저트
  emoji: "☕"
  vlm_hint: "음료, 디저트, 베이커리 중 무엇인지"
  scene_prompt: "cozy cafe table, wooden surface, soft window light"
  copy_persona: "동네 단골에게 말 걸듯 따뜻하고 짧게"
  keywords: [커피, 디저트, 케이크, 음료]
  legal_tags: [general, food]
  needs_photo: true
  status: verified

- id: restaurant
