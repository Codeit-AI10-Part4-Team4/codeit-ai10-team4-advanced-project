# 스타일 레지스트리
# 담당: 톤·조명·색상 팔레트·문구 어조
# 담당하지 않음: 무엇을 그릴지(industries.yaml), 치수(formats.yaml)
#
# palette:
#   bg     배경/여백 색
#   text   본문 텍스트 색
#   accent 강조(가격·뱃지) 색
#   band   이미지 위 텍스트 띠 색

- id: warm
  label: 따뜻한 감성
  emoji: "🕯️"
  prompt_suffix: "golden hour lighting, soft shadows, warm tone"
  palette:
    bg: "#F5EDE3"
    text: "#3B2A1E"
    accent: "#C4703A"
    band: "#2A1B10"
  grade: { brightness: 1.04, contrast: 1.05, saturation: 1.10, tint: "#C4703A", tint_alpha: 0.10 }
  copy_tone: "다정하고 편안한"

- id: modern
  label: 모던·미니멀
  emoji: "◻️"
  prompt_suffix: "clean studio lighting, minimal background, neutral tone"
  palette:
    bg: "#F2F2F0"
    text: "#1A1A1A"
    accent: "#2F6FED"
    band: "#111111"
  grade: { brightness: 1.02, contrast: 1.12, saturation: 0.92, tint: "#8FA3C0", tint_alpha: 0.05 }
  copy_tone: "간결하고 담백한"

- id: bold
  label: 강렬한 특가
  emoji: "🔥"
  prompt_suffix: "high contrast lighting, vivid colors, punchy"
  palette:
    bg: "#FFF3D6"
    text: "#1A1A1A"
    accent: "#E23B2E"
    band: "#8C1109"
  grade: { brightness: 1.06, contrast: 1.20, saturation: 1.25, tint: "#E23B2E", tint_alpha: 0.08 }
  copy_tone: "힘 있고 직설적인"

- id: natural
  label: 내추럴·신선
  emoji: "🌿"
  prompt_suffix: "bright daylight, fresh airy mood, natural texture"
  palette:
    bg: "#EEF4EA"
    text: "#22301F"
    accent: "#4B8B3B"
    band: "#1B2A18"
  grade: { brightness: 1.08, contrast: 1.04, saturation: 1.08, tint: "#7FB069", tint_alpha: 0.08 }
  copy_tone: "산뜻하고 건강한"
