<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0F5C42">
<title>동네 광고 만들기</title>
<meta name="description" content="사장님이 채팅으로 광고를 만들고, 우리 동네 손님들이 먼저 봐줍니다.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<a class="skip" href="#main">본문으로 건너뛰기</a>

<div class="shell">
  <header class="bar" id="bar" hidden>
    <button class="bar__back" type="button" data-back aria-label="뒤로">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="bar__title" id="bar-title"></h1>
    <button class="bar__menu" type="button" data-drawer aria-label="화면 목록" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
  </header>

  <main id="main" class="view" tabindex="-1"></main>
</div>

<!-- 시연용 화면 이동. 로그인이 목업이라 화면을 바로 열 수 있어야 팀이 검토할 수 있다. -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer__sheet" role="dialog" aria-modal="true" aria-label="화면 목록">
    <p class="drawer__note">시연용 — 아무 화면이나 바로 열 수 있습니다</p>
    <nav class="drawer__list" id="drawer-list"></nav>
    <button class="btn btn--line" type="button" data-drawer-close>닫기</button>
  </div>
</div>

<script src="./mock.js"></script>
<script src="./app.js"></script>
</body>
</html>
