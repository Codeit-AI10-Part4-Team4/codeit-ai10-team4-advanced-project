# 개발 환경 셋업
#
#   cp .env.example .env           먼저 이걸 하고 OPENAI_API_KEY 를 채운다
#
#   docker compose up app          챗봇 UI  → localhost:8501
#   docker compose run --rm app pytest
#   docker compose run --rm app bash
#   docker compose up gpu          이미지 생성 (GPU 필요)
#
# app 은 db 가 준비된 뒤에 뜬다. 처음 실행은 이미지 빌드 때문에 몇 분 걸린다.

name: ad-maker

services:
  # PostgreSQL — 계정 · 가게 · 주문서 · 생성 이력
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
      POSTGRES_DB: ads
    ports:
      - "5432:5432"   # 호스트에서 직접 붙어볼 때 쓴다
    volumes:
      # 이게 없으면 컨테이너를 지울 때 가입한 계정까지 날아간다
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # app 이 DB 보다 먼저 떠서 연결 실패하는 것을 막는다
      test: ["CMD-SHELL", "pg_isready -U ads -d ads"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 챗봇 UI · 문구 생성 · API — GPU 불필요
  app:
    build:
      context: .
      target: cpu
    ports:
      - "8501:8501"   # streamlit
      - "8000:8000"   # fastapi
    volumes:
      # 코드를 마운트 — 고칠 때마다 재빌드하지 않는다
      - .:/app
      # 컨테이너의 설치 정보를 호스트가 덮어쓰지 않게 분리
      - /app/src/codeit_ai10_team4_advanced_project.egg-info
    env_file:
      - .env
    environment:
      # .env 의 값을 덮어쓴다 — 컨테이너 안에서 DB 호스트는 localhost 가 아니라 db 다
      DATABASE_URL: postgresql+psycopg://ads:ads@db:5432/ads
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  # 이미지 생성 — GPU 필요
  gpu:
    build:
      context: .
      target: gpu
      args:
        # 드라이버에 맞춰 조정: nvidia-smi 상단의 CUDA Version 확인
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    ports:
      - "8502:8501"
      - "8001:8000"
    volumes:
      - .:/app
      # 모델 가중치 — 볼륨으로 빼지 않으면 재빌드마다 수십 GB 를 다시 받는다
      - models:/models
    env_file:
      - .env
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
  pgdata:
