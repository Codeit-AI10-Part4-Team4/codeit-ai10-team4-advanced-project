# 업종 목록
#
# 가게 등록 화면의 선택지이자, 저장 전 검증 기준이다.
# 업종을 늘릴 때 여기에 항목만 추가하면 되고 코드는 고치지 않는다.
#
# label 은 프롬프트에도 들어간다 — LLM 이 읽는 이름이므로
# 사람이 알아보는 말로 쓸 것 ("cafe" 가 아니라 "카페·디저트").
#
# 순서 = 화면에 뜨는 순서. 사업체가 많은 업종을 위로 둔다.
# 근거: 국세청 100대 생활업종 (2023년 말) — 한식음식점 41만, 부동산중개업 14.6만.
#   ⚠️ 전체 1위인 통신판매업(60.7만)은 뺐다. 온라인 판매라 오프라인 동네 매장이 아니다.
#   정확한 30위까지의 순위는 원본 데이터가 필요하다. 지금은 대략적인 규모 순이다.
#
# 목록에 없는 업종은 맨 아래 other(기타)로 받고 사장님이 직접 적는다.

