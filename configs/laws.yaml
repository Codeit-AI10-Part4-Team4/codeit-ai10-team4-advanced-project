# 적용 법령 레지스트리
#
# [⚖️ 이 광고, 법적으로 괜찮나요?] 패널의 "✅ 적용되는 규정" 목록을 구성한다.
# 업종 legal_tags × 규격 legal_tags 의 합집합과 매칭되는 법령이 표시된다.
#
# 현재는 룰 기반(사전 매핑)이다. RAG 를 얹으면 `we_did` 와 조문 요약을
# 법령 코퍼스에서 검색한 근거로 대체한다. → docs/02_광고규제_준수기능_설계.md
#
# ✅ 2026-08-04 원문 대조 완료 — docs/02 1-4절 '초안에서 정정된 것' 참조.
#    정정: 학원법 제15조→제17조①9호 / 체육시설법 '고지'→'반환 의무'
#          방판법 '청약철회'→'계약의 해지' / 의료법 제27조 표기 제거 / 옥외광고물법 허가·신고 구분
# ⬜ 미대조: 국민건강증진법, 청소년보호법, 가격표시제 (아직 laws.yaml 에 넣지 않음)

- id: fair_labeling
  name: 표시·광고의 공정화에 관한 법률
  article: 제3조 · 제5조
  legal_tags: [general]
  applies_when: 모든 광고에 적용됩니다
  summary: 거짓·과장, 기만, 부당비교, 비방 광고를 금지하며, 광고 내용의 실증 책임은 광고주에게 있습니다.
  we_did: 객관적 근거가 필요한 최상급·순위 표현("최고", "1위", "최초")을 문구 생성 단계에서 배제했습니다.
  url: https://www.law.go.kr/LSW/lsInfoP.do?lsId=002011&ancYnChk=0

- id: food_labeling
  name: 식품 등의 표시·광고에 관한 법률
  article: 제8조
  legal_tags: [food]
  applies_when: 음식점·카페 등 식품을 조리·판매하는 업종에 적용됩니다
  summary: 질병의 예방·치료 효능으로 인식할 우려가 있는 광고, 식품을 의약품이나 건강기능식품으로 오인하게 하는 광고를 금지합니다.
  we_did: 질병·효능 표현과 "다이어트" 등 체중조절 문구를 생성 단계에서 차단했습니다.
  url: https://www.law.go.kr/LSW/lsInfoP.do?efYd=20230101&lsiSeq=234849

- id: origin_labeling
  name: 농수산물의 원산지 표시 등에 관한 법률
  article: 제5조
  legal_tags: [origin]
  applies_when: 음식점·식육판매업 등 원산지 표시 대상 품목을 취급할 때 적용됩니다
  summary: 주요 품목의 원산지를 표시할 의무가 있으며, 광고에 표기한 원산지는 실제와 일치해야 합니다.
  we_did: 원산지 관련 표현이 포함되면 실제와 일치하는지 확인하도록 안내합니다.
  url: https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=228266

- id: outdoor_ad
  name: 옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률
  article: 제3조
  legal_tags: [outdoor]
  applies_when: 현수막·입간판·매장 앞 배너·전단 등 옥외 게시물에 적용됩니다 (온라인 게시물은 해당 없음)
  summary: 현수막·벽보·전단은 신고 대상이고, 그 밖의 광고물은 허가 대상입니다. 규격·설치 장소에도 제한이 있습니다.
  we_did: 인쇄용 규격을 선택하셨기에 안내드립니다. 실제 게시 전 관할 지자체에 확인이 필요합니다.
  url: https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=246917

- id: medical_act
  name: 의료법
  article: 제56조 (의료광고의 금지 등)
  legal_tags: [medical_adjacent]
  applies_when: 미용업에서 의료행위로 오인될 수 있는 표현을 사용할 때 적용될 수 있습니다
  summary: 의료인등이 아닌 자는 의료에 관한 광고를 할 수 없으며, 의료인등도 치료 효과를 단정하는 광고 등은 금지됩니다.
  we_did: 의료행위로 오인될 수 있는 표현을 경고 대상으로 관리합니다.
  url: https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=252205

- id: academy_act
  name: 학원의 설립·운영 및 과외교습에 관한 법률
  article: 제17조 제1항 제9호
  legal_tags: [academy]
  applies_when: 학원·교습소·공부방이 학습자를 모집하는 광고에 적용됩니다
  summary: 학습자를 모집할 때 과대 또는 거짓 광고를 하면 등록말소 또는 1년 이내의 교습정지 대상이 됩니다.
  we_did: 성적·합격을 보장하는 표현을 생성 단계에서 차단했습니다.
  url: https://law.go.kr/LSW/lsInfoP.do?lsId=000850

- id: fitness_act
  name: 체육시설의 설치·이용에 관한 법률 / 방문판매 등에 관한 법률
  article: 체육시설법 제22조 · 방문판매법 제31조
  legal_tags: [fitness]
  applies_when: 헬스장·필라테스 등 회원권을 판매하는 업종에 적용됩니다
  summary: 이용자가 개인 사정으로 이용하지 못하거나 사업자가 휴·폐업하면 이용료를 반환해야 하며(체육시설법 제22조), 계속거래 계약은 기간 중 언제든지 해지할 수 있습니다(방문판매법 제31조).
  we_did: 환불·해지를 제한하는 표현을 차단했습니다.
  url: https://www.law.go.kr/LSW/lsInfoP.do?lsId=000820&ancYnChk=0
